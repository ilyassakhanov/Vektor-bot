name: CI

on:
  push:
    branches: [main]
  pull_request:

# The run token gets read-only permissions: CI never writes to the repo.
permissions:
  contents: read

# A new push to a PR branch cancels the run for the stale commit; pushes to
# main always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Separate steps: one combined step would report two unrelated
      # problems as a single failure.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python -m pytest

  # A spec error otherwise surfaces only at archive time: a requirement
  # without a scenario, a MODIFIED delta losing scenarios, an ADDED
  # duplicate. --strict also catches overly long requirements. The CLI
  # version is pinned: new checks arrive with an upgrade, not silently.
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict
      # A change with all tasks complete is archived in the same PR —
      # otherwise its deltas never reach openspec/specs/. Open changes are
      # listed in the step summary.
      # `shell: bash` opts into `-eo pipefail`: the default `bash -e`
      # without pipefail would mask an npx failure whenever python3
      # succeeds on its stdout.
      - shell: bash
        run: npx --yes @fission-ai/openspec@1.14.1 list --json | python3 scripts/check_openspec_archived.py

  # The container is the host boundary for model-chosen exec commands, so its
  # invariants are checked on the built image, not only in the source files
  # (tests/test_docker_config.py). The image is built here, never locally.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # `shell: bash` gives `-eo pipefail`; each step adds `set -u` too.
        shell: bash
    env:
      VEKTOR_IMAGE: vektor:ci
    steps:
      - uses: actions/checkout@v7
      # compose.yaml requires an env file; CI gets a dummy one, no secrets.
      - name: Write dummy env file
        run: |
          set -euo pipefail
          printf 'TELEGRAM_BOT_TOKEN=123:dummy\n' > "$RUNNER_TEMP/ci.env"
          echo "VEKTOR_ENV_FILE=$RUNNER_TEMP/ci.env" >> "$GITHUB_ENV"
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker compose config -q
      - name: Build image
        run: |
          set -euo pipefail
          docker build -t vektor:ci .
      # Imports the whole bot under the runtime flags that matter: a
      # read-only root filesystem with only /tmp writable.
      - name: Smoke test (import bot)
        run: |
          set -euo pipefail
          docker run --rm --read-only --tmpfs /tmp -e TELEGRAM_BOT_TOKEN=123:dummy \
            vektor:ci python -c "import bot"
      # Each check names what failed; the first failure stops the step.
      - name: Assert image invariants
        run: |
          set -euo pipefail
          docker run --rm -i --read-only --tmpfs /tmp vektor:ci sh -s <<'SH'
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }
          uid="$(id -u)"
          [ "$uid" = 10001 ] || fail "runs as uid $uid, want 10001"
          for b in curl dig nslookup whois host; do
            test -x "/usr/bin/$b" || fail "exec binary missing: /usr/bin/$b"
          done
          for b in ps kill pkill pgrep killall top; do
            for d in /usr/bin /bin /usr/sbin /sbin; do
              test ! -e "$d/$b" || fail "process-control binary present: $d/$b"
            done
          done
          for p in /app/.env /app/data /app/tests; do
            test ! -e "$p" || fail "must not be in the image: $p"
          done
          echo "image invariants OK"
          SH
